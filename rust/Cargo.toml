[package]
name = "isonform"
# Matches the Python's advertised version, which is what `--version` prints and
# what setup.py declares. Keep the two in step: the CLI string lives in
# `cli::VERSION`.
version = "0.3.9"
edition = "2021"
# Raised from 1.74 by spoars, which requires 1.85. Kept in step with the
# isONcorrect port so the shared modules move between the two unchanged.
rust-version = "1.85"
description = "De novo construction of isoforms from long-read data"
repository = "https://github.com/aljpetri/isONform"
license = "GPL-3.0-only"

[dependencies]
clap = { version = "4", features = ["derive"] }
# WFA2 (wavefront alignment), as a faster stand-in for the semi-global DP at the
# two hot alignment sites. Measured on 54 884 recorded real calls: 4.5x our
# parasail overall, and 7.3x in the 80-90%-identity bucket that holds 59% of
# them. `biodiff-wfa2-sys` rather than `libwfa2` because the latter's manifest
# uses `profile-rustflags` and so needs nightly cargo; this one vendors WFA2-lib
# and ships pregenerated bindings, so it needs cmake but not bindgen. See
# src/wfa.rs for why WFA2's ends-free mode is NOT parasail's semi-global.
biodiff-wfa2-sys = "2.3.5"
# Node and edge lookup during graph construction. The keys are small integer
# tuples, so the cryptographic strength of SipHash buys nothing and costs
# measurably; this is the same choice the isONcorrect port made.
rustc-hash = "2.1.3"
# Consensus by partial-order alignment: a pure-Rust reimplementation of spoa,
# which the reference shells out to as `spoa <reads> -l 0 -r 0 -g -2`. Carried
# across from the isONcorrect port, where a differential oracle showed it
# matching the `spoa` binary on 505 of 505 real intervals --- that check has NOT
# yet been repeated on isONform's own inputs, which are different sequences from
# a different stage. See src/poa.rs.
#
# `default-features = false` drops spoars's `cli` feature, which pulls needletail
# and with it bzip2, liblzma and zstd, all compiled through cc-rs. That silently
# makes the dependency tree non-pure-Rust and breaks musl builds. Only the
# library is needed.
spoars = { version = "0.1.3", default-features = false }

# The merge and bubble-popping aligner. SIMD (Neon/AVX2/SSE2) and adaptively
# banded; isONcorrect measured it 8-99x faster than the exact DP it replaces, and
# profiling here says alignment is the dominant cost in *both* `merge_consensuses`
# and `pop_bubbles`, so it is the one dependency that touches the whole pipeline.
#
# NOTE: the SIMD backend is a *target-specific* feature and must stay that way.
# These four blocks are copied from isONcorrect because each one is a bug someone
# already hit:
#
#   * listing `simd_neon` unconditionally makes the crate aarch64-only --- on
#     x86_64 it fails with "unresolved import `std::arch::aarch64`";
#   * x86_64 defaults to **SSE2, not AVX2**, deliberately. block-aligner picks its
#     backend at *compile time* with no runtime dispatch, so an AVX2 build runs
#     AVX2 unconditionally and dies with SIGILL on any pre-Haswell CPU. SSE2 is
#     part of the x86_64 baseline, so it always runs;
#   * anything else (wasm, 32-bit x86, riscv) gets the portable scalar backend
#     rather than failing to build.
[target.'cfg(target_arch = "aarch64")'.dependencies]
block-aligner = { version = "0.5.1", features = ["simd_neon"] }

[target.'cfg(all(target_arch = "x86_64", target_feature = "avx2"))'.dependencies]
block-aligner = { version = "0.5.1", features = ["simd_avx2"] }

[target.'cfg(all(target_arch = "x86_64", not(target_feature = "avx2")))'.dependencies]
block-aligner = { version = "0.5.1", features = ["simd_sse2"] }

[target.'cfg(not(any(target_arch = "aarch64", target_arch = "x86_64")))'.dependencies]
block-aligner = { version = "0.5.1", features = ["no_simd"] }

[dev-dependencies]
# The graph oracle builds the same maps the port does.
rustc-hash = "2.1.3"
# Consensus by partial-order alignment: a pure-Rust reimplementation of spoa,
# which the reference shells out to as `spoa <reads> -l 0 -r 0 -g -2`. Carried
# across from the isONcorrect port, where a differential oracle showed it
# matching the `spoa` binary on 505 of 505 real intervals --- that check has NOT
# yet been repeated on isONform's own inputs, which are different sequences from
# a different stage. See src/poa.rs.
#
# `default-features = false` drops spoars's `cli` feature, which pulls needletail
# and with it bzip2, liblzma and zstd, all compiled through cc-rs. That silently
# makes the dependency tree non-pure-Rust and breaks musl builds. Only the
# library is needed.
spoars = { version = "0.1.3", default-features = false }

[lib]
name = "isonform"
path = "src/lib.rs"

# Binary names must match the Python entry points exactly; existing pipelines
# (and isON_pipeline.sh) invoke them by these names. `main` is an odd name for a
# binary, but setup.py ships `scripts=['isONform_parallel','main']` and that is
# the contract.
[[bin]]
name = "main"
path = "src/bin/main.rs"

[[bin]]
name = "isONform_parallel"
path = "src/bin/isonform_parallel.rs"

[profile.release]
lto = "thin"
codegen-units = 1
